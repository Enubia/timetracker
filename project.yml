name: TimeTracker
options:
  bundleIdPrefix: com.marcoschuster
  deploymentTarget:
    macOS: "14.0"
  createIntermediateGroups: true
settings:
  base:
    CODE_SIGN_IDENTITY: "-"
    CODE_SIGN_STYLE: Manual
    DEVELOPMENT_TEAM: ""
    SWIFT_VERSION: "5.9"
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
targets:
  TimeTracker:
    type: application
    platform: macOS
    sources:
      - path: Sources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.marcoschuster.timetracker
        PRODUCT_NAME: TimeTracker
        INFOPLIST_FILE: Sources/Support/Info.plist
        CODE_SIGN_ENTITLEMENTS: Sources/Support/TimeTracker.entitlements
        ENABLE_HARDENED_RUNTIME: YES
  TimeTrackerTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - path: Tests
    dependencies:
      - target: TimeTracker
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.marcoschuster.timetracker.tests
